<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vishesh source image audit</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 20px; background: #f5f5f5; }
    h1 { margin: 0 0 16px; }
    #grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
    figure { margin: 0; background: white; border: 1px solid #ddd; border-radius: 10px; padding: 8px; }
    img { width: 100%; aspect-ratio: 1; object-fit: contain; display: block; }
    figcaption { text-align: center; font-weight: 700; font-size: 18px; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>Original Shopify Files 1–62</h1>
  <main id="grid"></main>
  <script>
    const grid = document.querySelector('#grid');
    for (let n = 1; n <= 62; n += 1) {
      const figure = document.createElement('figure');
      const image = document.createElement('img');
      image.src = `https://cdn.shopify.com/s/files/1/0701/6762/5841/files/${n}_800x800.png`;
      image.alt = `Shopify file ${n}`;
      const caption = document.createElement('figcaption');
      caption.textContent = n;
      figure.append(image, caption);
      grid.append(figure);
    }
  </script>
</body>
</html>
